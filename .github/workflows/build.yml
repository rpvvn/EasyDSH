name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose toolchain
        shell: cmd
        run: |
          echo === csc.exe ===
          dir "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" 2>&1
          echo === WPF PresentationCore ===
          dir "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\WPF\PresentationCore.dll" 2>&1
          echo === working files ===
          dir 2>&1

      - name: Build EXE
        shell: cmd
        run: build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Launcher
          path: DSH-Launcher.exe
          if-no-files-found: error

      - name: Create/Update Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file UpdateLog.md
            gh release upload "${GITHUB_REF_NAME}" DSH-Launcher.exe --clobber
          else
            gh release create "${GITHUB_REF_NAME}" DSH-Launcher.exe \
              --title "DSH Launcher ${GITHUB_REF_NAME}" \
              --notes-file UpdateLog.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
