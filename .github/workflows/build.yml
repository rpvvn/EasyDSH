name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose toolchain
        shell: cmd
        run: |
          echo === csc.exe ===
          dir "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" 2>&1
          echo === WPF PresentationCore ===
          dir "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\WPF\PresentationCore.dll" 2>&1
          echo === working files ===
          dir 2>&1

      - name: Build EXE
        shell: cmd
        run: build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Launcher
          path: DSH-Launcher.exe
          if-no-files-found: error

      - name: Extract Release Notes for tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # v2.2.1 → 2.2.1
          UPDATE_LOG="UpdateLog.md"

          # 1) Locate the version header line, e.g. "## [2.2.1]"
          START_LINE=$(grep -n "^## \\[${VERSION}\\]" "$UPDATE_LOG" | head -1 | cut -d: -f1)
          if [ -z "$START_LINE" ]; then
            echo "::error::Version ${VERSION} not found in ${UPDATE_LOG}"
            exit 1
          fi

          # 2) From the line AFTER START_LINE, find the NEXT version header "## ["
          #    (tail -n +N = print from line N onward; grep -n renumbers from 1)
          NEXT_LINE=$(tail -n +$((START_LINE + 1)) "$UPDATE_LOG" | grep -n "^## \\[" | head -1 | cut -d: -f1)

          # 3) Extract everything from START_LINE up to (but NOT including) the next header
          if [ -z "$NEXT_LINE" ]; then
            # No next version → extract to end of file
            tail -n +"$START_LINE" "$UPDATE_LOG" > release_notes.md
          else
            END_LINE=$((START_LINE + NEXT_LINE - 1))
            sed -n "${START_LINE},${END_LINE}p" "$UPDATE_LOG" > release_notes.md
          fi

          echo "=== Release Notes for ${VERSION} ==="
          cat release_notes.md

      - name: Create/Update Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file release_notes.md
            gh release upload "${GITHUB_REF_NAME}" DSH-Launcher.exe --clobber
          else
            gh release create "${GITHUB_REF_NAME}" DSH-Launcher.exe \
              --title "DSH Launcher ${GITHUB_REF_NAME}" \
              --notes-file release_notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
